name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS syntax
        run: |
          for f in $(find . -name '*.js' -not -path './node_modules/*'); do
            node --check "$f" || exit 1
          done

      - name: Python compile
        run: |
          python3 -m compileall -q relay tools

      - name: JSON valid
        run: |
          for f in $(find . -name '*.json' -not -path './node_modules/*'); do
            python3 -m json.tool "$f" > /dev/null || exit 1
          done

      - name: Secret scan
        run: python3 tools/scan_secrets.py . --history
